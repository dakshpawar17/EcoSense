version: '3.8'

services:
  ecosense-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./ecosense.db
      - PORT=5000
    volumes:
      - sqlite_data:/app/backend/prisma
    restart: always

volumes:
  sqlite_data:
